resource:
    name: Orders
    shortName: orders

    provider: Spryker\Glue\OrdersRestApi\Api\Storefront\Provider\OrdersStorefrontProvider
    security: "is_granted('ROLE_CUSTOMER')"

    operations:
        - type: Get
          extraProperties:
              notFoundCode: '801'
              notFoundMessage: "Can't find order by the given order reference"
          normalizationContext:
              skip_null_values: false
          openapiContext:
              responses:
                  200:
                      description: 'Order returned.'
                  401:
                      description: 'Invalid access token.'
                  403:
                      description: 'Access denied: missing access token or insufficient scope.'
                  404:
                      description: 'Order not found.'
        - type: GetCollection
          openapiContext:
              parameters:
                  - name: 'sort'
                    in: query
                    required: false
                    description: 'Order list field to sort by, prefixed with `-` for descending order.'
                    schema:
                        type: string
                        enum: [createdAt, -createdAt, updatedAt, -updatedAt]
                    example: '-createdAt'
              responses:
                  200:
                      description: 'Order collection returned.'
                  401:
                      description: 'Invalid access token.'
                  403:
                      description: 'Access denied: missing access token or insufficient scope.'

    includes:
        - relationshipName: merchants
          targetResource: Merchants
          resolverClass: Spryker\Glue\MerchantsRestApi\Relationship\OrderMerchantsRelationshipResolver
        - relationshipName: order-shipments
          targetResource: OrderShipments
          resolverClass: Spryker\Glue\ShipmentsRestApi\Api\Storefront\Relationship\OrderShipmentsRelationshipResolver
        - relationshipName: order-items
          targetResource: OrderItems
          resolverClass: Spryker\Glue\OrdersRestApi\Api\Storefront\Relationship\OrderItemsRelationshipResolver

    properties:
        orderReference:
            type: string
            description: 'Order reference (identifier).'
            identifier: true
            readable: true
            writable: false
            openapiContext:
                example: 'DE--1'

        createdAt:
            type: string
            description: 'Order creation timestamp (Y-m-d H:i:s.u).'
            readable: true
            writable: false
            openapiContext:
                example: '2024-01-01 12:00:00.000000'

        currencyIsoCode:
            type: string
            description: 'ISO 4217 currency code the order was placed in.'
            readable: true
            writable: false
            openapiContext:
                example: 'EUR'

        priceMode:
            type: string
            description: 'Price mode the order was placed in (GROSS_MODE or NET_MODE).'
            readable: true
            writable: false
            openapiContext:
                example: 'GROSS_MODE'

        merchantReferences:
            type: array
            itemOnly: true
            description: 'Collection of merchant references for the order (marketplace).'
            readable: true
            writable: false
            required: false
            openapiContext:
            example: ['MER000001']

        totals:
            type: object
            objectName: Totals
            description: 'Order totals (subtotal, grand total, tax total, etc.) in cents.'
            readable: true
            writable: false
            properties:
                subtotal:
                    type: integer
                    description: 'Total of all items before discounts, taxes, and expenses.'
                    openapiContext:
                        example: 9902
                discountTotal:
                    type: integer
                    description: 'Total discounts applied to the order.'
                    openapiContext:
                        example: 0
                taxTotal:
                    type: integer
                    description: 'Total tax for the order.'
                    openapiContext:
                        example: 1922
                expenseTotal:
                    type: integer
                    description: 'Total expenses (e.g. shipping) booked on the order.'
                    openapiContext:
                        example: 490
                grandTotal:
                    type: integer
                    description: 'Final order total including all costs and discounts.'
                    openapiContext:
                        example: 10392
                canceledTotal:
                    type: integer
                    description: 'Total amount canceled on the order.'
                    openapiContext:
                        example: 0
                remunerationTotal:
                    type: integer
                    description: 'Total remuneration (e.g. credit) applied to the order.'
                    openapiContext:
                        example: 0

        items:
            type: array
            itemOnly: true
            description: 'Order line items.'
            readable: true
            writable: false
            openapiContext:
                example: []

        expenses:
            type: array
            itemOnly: true
            description: 'Expenses (e.g. shipping costs) booked on the order.'
            readable: true
            writable: false
            openapiContext:
                example: []

        billingAddress:
            type: object
            objectName: Address
            itemOnly: true
            description: 'Billing address snapshot at the time the order was placed.'
            readable: true
            writable: false
            properties:
                salutation:
                    type: string
                    nullable: true
                    description: 'Salutation.'
                    openapiContext:
                        example: 'Mr'
                firstName:
                    type: string
                    nullable: true
                    description: 'First name.'
                    openapiContext:
                        example: 'John'
                middleName:
                    type: string
                    nullable: true
                    description: 'Middle name.'
                    openapiContext:
                        example: null
                lastName:
                    type: string
                    nullable: true
                    description: 'Last name.'
                    openapiContext:
                        example: 'Doe'
                address1:
                    type: string
                    nullable: true
                    description: 'Street name.'
                    openapiContext:
                        example: 'Julie-Wolfthorn-Strasse'
                address2:
                    type: string
                    nullable: true
                    description: 'House number.'
                    openapiContext:
                        example: '1'
                address3:
                    type: string
                    nullable: true
                    description: 'Additional address line.'
                    openapiContext:
                        example: null
                zipCode:
                    type: string
                    nullable: true
                    description: 'ZIP / postal code.'
                    openapiContext:
                        example: '10115'
                city:
                    type: string
                    nullable: true
                    description: 'City.'
                    openapiContext:
                        example: 'Berlin'
                country:
                    type: string
                    nullable: true
                    description: 'Country name.'
                    openapiContext:
                        example: 'Germany'
                company:
                    type: string
                    nullable: true
                    description: 'Company name.'
                    openapiContext:
                        example: 'Spryker Systems GmbH'
                iso2Code:
                    type: string
                    nullable: true
                    description: 'ISO 3166-1 alpha-2 country code.'
                    openapiContext:
                        example: 'DE'
                phone:
                    type: string
                    nullable: true
                    description: 'Phone number.'
                    openapiContext:
                        example: '+49 30 2084983050'
                poBox:
                    type: string
                    nullable: true
                    description: 'PO box.'
                    openapiContext:
                        example: null
                cellPhone:
                    type: string
                    nullable: true
                    description: 'Cell phone number.'
                    openapiContext:
                        example: null
                comment:
                    type: string
                    nullable: true
                    description: 'Address comment.'
                    openapiContext:
                        example: null
                description:
                    type: string
                    nullable: true
                    description: 'Address description.'
                    openapiContext:
                        example: null
                email:
                    type: string
                    nullable: true
                    description: 'Email address.'
                    openapiContext:
                        example: null

        shippingAddress:
            type: object
            objectName: Address
            itemOnly: true
            description: 'Shipping address snapshot at the time the order was placed (nullable for multi-shipment orders).'
            nullable: true
            readable: true
            writable: false
            properties:
                salutation:
                    type: string
                    nullable: true
                    description: 'Salutation.'
                    openapiContext:
                        example: 'Mr'
                firstName:
                    type: string
                    nullable: true
                    description: 'First name.'
                    openapiContext:
                        example: 'John'
                middleName:
                    type: string
                    nullable: true
                    description: 'Middle name.'
                    openapiContext:
                        example: null
                lastName:
                    type: string
                    nullable: true
                    description: 'Last name.'
                    openapiContext:
                        example: 'Doe'
                address1:
                    type: string
                    nullable: true
                    description: 'Street name.'
                    openapiContext:
                        example: 'Julie-Wolfthorn-Strasse'
                address2:
                    type: string
                    nullable: true
                    description: 'House number.'
                    openapiContext:
                        example: '1'
                address3:
                    type: string
                    nullable: true
                    description: 'Additional address line.'
                    openapiContext:
                        example: null
                zipCode:
                    type: string
                    nullable: true
                    description: 'ZIP / postal code.'
                    openapiContext:
                        example: '10115'
                city:
                    type: string
                    nullable: true
                    description: 'City.'
                    openapiContext:
                        example: 'Berlin'
                country:
                    type: string
                    nullable: true
                    description: 'Country name.'
                    openapiContext:
                        example: 'Germany'
                company:
                    type: string
                    nullable: true
                    description: 'Company name.'
                    openapiContext:
                        example: 'Spryker Systems GmbH'
                iso2Code:
                    type: string
                    nullable: true
                    description: 'ISO 3166-1 alpha-2 country code.'
                    openapiContext:
                        example: 'DE'
                phone:
                    type: string
                    nullable: true
                    description: 'Phone number.'
                    openapiContext:
                        example: '+49 30 2084983050'
                poBox:
                    type: string
                    nullable: true
                    description: 'PO box.'
                    openapiContext:
                        example: null
                cellPhone:
                    type: string
                    nullable: true
                    description: 'Cell phone number.'
                    openapiContext:
                        example: null
                comment:
                    type: string
                    nullable: true
                    description: 'Address comment.'
                    openapiContext:
                        example: null
                description:
                    type: string
                    nullable: true
                    description: 'Address description.'
                    openapiContext:
                        example: null
                email:
                    type: string
                    nullable: true
                    description: 'Email address.'
                    openapiContext:
                        example: null

        payments:
            type: array
            itemOnly: true
            description: 'Payments associated with the order.'
            readable: true
            writable: false
            openapiContext:
                example: []

        shipments:
            type: array
            itemOnly: true
            description: 'Shipments associated with the order.'
            readable: true
            writable: false
            openapiContext:
                example: []

        calculatedDiscounts:
            type: array
            itemOnly: true
            description: 'Calculated discounts applied to the order.'
            readable: true
            writable: false
            openapiContext:
                example: []

        context:
            type: map
            description: 'Internal order context data (not serialized).'
            readable: false
            writable: false
            required: false
            openapiContext:
                example: {}

        pagination:
            type: object
            objectName: Pagination
            collectionOnly: true
            description: 'Pagination metadata for the collection.'
            readable: true
            writable: false
            properties:
                currentPage:
                    type: integer
                    description: 'Current page number.'
                    openapiContext:
                        example: 1
                maxPage:
                    type: integer
                    description: 'Total number of pages.'
                    openapiContext:
                        example: 10
                currentItemsPerPage:
                    type: integer
                    description: 'Number of items per page.'
                    openapiContext:
                        example: 10
                numFound:
                    type: integer
                    description: 'Total number of items found.'
                    openapiContext:
                        example: 100
