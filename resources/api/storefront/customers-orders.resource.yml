resource:
    name: CustomersOrders
    shortName: orders

    provider: Spryker\Glue\OrdersRestApi\Api\Storefront\Provider\CustomersOrdersStorefrontProvider

    operations:
        - type: GetCollection
          security: "is_granted('ROLE_CUSTOMER') and is_granted('CUSTOMER_OWNER', request.attributes.get('customerReference'))"
          uriTemplate: /customers/{customerReference}/orders
          uriVariables:
              customerReference:
                  fromClass: CustomersStorefrontResource
          openapiContext:
              responses:
                  200:
                      description: 'Order collection returned for the given customer.'
                  401:
                      description: 'Missing access token.'
                  403:
                      description: 'Customer reference does not belong to the authenticated customer.'

    properties:
        orderReference:
            type: string
            description: 'Order reference (identifier).'
            identifier: true
            readable: true
            writable: false
            openapiContext:
                example: 'DE--1'

        createdAt:
            type: string
            description: 'Order creation timestamp (Y-m-d H:i:s.u).'
            readable: true
            writable: false
            openapiContext:
                example: '2024-01-01 12:00:00.000000'

        currencyIsoCode:
            type: string
            description: 'ISO 4217 currency code the order was placed in.'
            readable: true
            writable: false
            openapiContext:
                example: 'EUR'

        priceMode:
            type: string
            description: 'Price mode the order was placed in (GROSS_MODE or NET_MODE).'
            readable: true
            writable: false
            openapiContext:
                example: 'GROSS_MODE'

        totals:
            type: object
            objectName: Totals
            description: 'Order totals (subtotal, grand total, tax total, etc.) in cents.'
            readable: true
            writable: false
            properties:
                expenseTotal:
                    type: integer
                    description: 'Total expenses (e.g. shipping) booked on the order.'
                    openapiContext:
                        example: 490
                discountTotal:
                    type: integer
                    description: 'Total discounts applied to the order.'
                    openapiContext:
                        example: 0
                taxTotal:
                    type: integer
                    description: 'Total tax for the order.'
                    openapiContext:
                        example: 1922
                subtotal:
                    type: integer
                    description: 'Total of all items before discounts, taxes, and expenses.'
                    openapiContext:
                        example: 9902
                grandTotal:
                    type: integer
                    description: 'Final order total including all costs and discounts.'
                    openapiContext:
                        example: 10392
                canceledTotal:
                    type: integer
                    description: 'Total amount canceled on the order.'
                    openapiContext:
                        example: 0
                remunerationTotal:
                    type: integer
                    description: 'Total remuneration (e.g. credit) applied to the order.'
                    openapiContext:
                        example: 0

        pagination:
            type: object
            objectName: Pagination
            collectionOnly: true
            description: 'Pagination metadata for the collection.'
            readable: true
            writable: false
            properties:
                currentPage:
                    type: integer
                    description: 'Current page number.'
                    openapiContext:
                        example: 1
                maxPage:
                    type: integer
                    description: 'Total number of pages.'
                    openapiContext:
                        example: 10
                currentItemsPerPage:
                    type: integer
                    description: 'Number of items per page.'
                    openapiContext:
                        example: 10
                numFound:
                    type: integer
                    description: 'Total number of items found.'
                    openapiContext:
                        example: 100
